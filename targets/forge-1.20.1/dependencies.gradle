repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.sighs.cc/repository/maven-public/' }
        }
        filter { includeGroup 'com.sighs' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.1'
    modImplementation 'com.sighs:ApricityUI-forge-1.20.1:1.3.0'

    modImplementation 'curse.maven:kubejs-238086:5853326'
    modImplementation 'curse.maven:rhino-416294:6186971'
    modImplementation 'curse.maven:architectury-api-419699:5137938'
    modImplementation 'curse.maven:tacz-addon-1238419:8204790'
}
