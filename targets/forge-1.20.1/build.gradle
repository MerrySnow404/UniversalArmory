plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version
base { archivesName = "${mod_name}-forge-1.20.1" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDir layout.buildDirectory.dir('generated/common-main')
        resources.srcDir 'src/generated/resources'
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java')
    into layout.buildDirectory.dir('generated/common-main')
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar').configure { dependsOn 'prepareCommonSources' }

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    runs {
        client {
            client()
            if (providers.gradleProperty('armory.testWorld').isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', providers.gradleProperty('armory.testWorld').get()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath, '--existing', file('../../common/src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.sighs.cc/repository/maven-public/' }
        }
        filter { includeGroup 'com.sighs' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            flatDir { dirs file('../../../AutoJS/targets/forge-1.20.1/build/libs') }
        }
        filter { includeGroup 'autojs.dev' }
    }
}

dependencies {
    modRuntimeOnly 'autojs.dev:AutoJS-forge-1.20.1:1.0.1'
    compileOnly 'org.jetbrains:annotations:24.0.1'
    modImplementation 'com.sighs:ApricityUI-forge-1.20.1:1.2.9'
    modImplementation 'curse.maven:kubejs-238086:5853326'
    modImplementation 'curse.maven:rhino-416294:6186971'
    modImplementation 'curse.maven:architectury-api-419699:5137938'
    modImplementation 'curse.maven:tacz-addon-1238419:8204790'
}

ext.armoryLocalLibraries = file('libs')
apply from: file('../../gradle/target-conventions/local-dependencies.gradle')

mixin {
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: forge_minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: forge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': "${mod_id}.mixins.json"
    ])
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

apply from: file('../../gradle/target-conventions/publish.gradle')
