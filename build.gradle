def targetBuilds = [
        'forge-1.20.1': [directory: 'targets/forge-1.20.1', task: 'buildForge1201']
]

def selectedTarget = providers.gradleProperty('target').getOrElse('forge-1.20.1')
if (!targetBuilds.containsKey(selectedTarget)) {
    throw new GradleException("Unknown target '${selectedTarget}'. Available targets: ${targetBuilds.keySet().join(', ')}")
}

def registerTargetTask = { String taskName, String targetDirectory, List<String> targetTasks ->
    tasks.register(taskName, Exec) {
        group = 'build'
        workingDir rootDir
        def arguments = ['-p', targetDirectory] + targetTasks + ['--console', 'plain']
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            commandLine(['cmd', '/c', new File(rootDir, 'gradlew.bat').absolutePath] + arguments)
        } else {
            commandLine(['sh', new File(rootDir, 'gradlew').absolutePath] + arguments)
        }
    }
}

targetBuilds.each { name, target ->
    registerTargetTask(target.task, target.directory, ['build'])
    registerTargetTask("clean${target.task.capitalize()}", target.directory, ['clean'])
    tasks.named(target.task).configure { mustRunAfter "clean${target.task.capitalize()}" }
}

tasks.register('build') {
    group = 'build'
    dependsOn targetBuilds[selectedTarget].task
    if (providers.gradleProperty('allTargets').map { it.toBoolean() }.getOrElse(false)) {
        dependsOn targetBuilds.values()*.task
    }
}

tasks.register('clean') {
    group = 'build'
    dependsOn "clean${targetBuilds[selectedTarget].task.capitalize()}"
}
