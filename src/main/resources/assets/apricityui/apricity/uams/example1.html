<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航空枪械改造台</title>
    <style>
        :root {
            --blue-dark: #1e3a8a;
            --blue-main: #2563eb;
            --blue-light: #dbeafe;
            --blue-pale: #eff6ff;
            --blue-mid: #1d4ed8;
            --blue-soft: #93c5fd;
            --blue-strong: #1e40af;
            --blue-deep: #172554;
            --blue-muted: #3b82f6;
            --blue-faint: #60a5fa;
            --blue-panel: rgba(255, 255, 255, 0.4);
            --red: #dc2626;
            --red-dark: #b91c1c;
            --green-soft: #4ade80;
            --bg: #f0f4ff;
        }

        * { box-sizing: border-box; }

        html {
            background-color: #000;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            color: var(--blue-dark);
            overflow: hidden;
            margin: 0;
            height: 100vh;
            background-image:
                    linear-gradient(rgba(37, 99, 235, 0.07) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(37, 99, 235, 0.07) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        @media (max-width: 500px) {
            :root { font-size: 5.6px; }
            html {
                background-color: var(--bg);
            }
            body {
                background-image:
                        linear-gradient(rgba(37, 99, 235, 0.07) 0.35px, transparent 0.35px),
                        linear-gradient(90deg, rgba(37, 99, 235, 0.07) 0.35px, transparent 0.35px);
                background-size: 9.8px 9.8px;
            }
            .w-px.my-8 { margin-top: 4rem; margin-bottom: 0; }
            section.w-1\/2.flex.flex-col.pl-6.relative.z-10 > .flex.items-center.justify-between.mb-4 {
                margin-bottom: 1.14rem;
            }
            section.w-1\/2.flex.flex-col.pl-6.relative.z-10 h2 {
                font-size: 1.5rem;
                line-height: 2rem;
                gap: 0.75rem;
            }
            section.w-1\/2.flex.flex-col.pl-6.relative.z-10 h2 .h-7 {
                height: 1.75rem;
            }
            .weapon-outer-frame { border-width: 1px; }
            .weapon-inner-frame { border-width: 1px; }
            body .corner-tl,
            body .corner-tr,
            body .corner-bl,
            body .corner-br {
                width: 1.25rem;
                height: 1.25rem;
            }
            body .corner-tl {
                border-top-width: 2px;
                border-left-width: 2px;
            }
            body .corner-tr {
                border-top-width: 2px;
                border-right-width: 2px;
            }
            body .corner-bl {
                border-bottom-width: 2px;
                border-left-width: 2px;
            }
            body .corner-br {
                width: 2rem;
                height: 2rem;
                border-bottom-width: 2px;
                border-right-width: 2px;
            }
            body .corner-tl,
            body .corner-tr {
                top: -1px;
            }
            body .corner-bl,
            body .corner-br {
                bottom: -1px;
            }
            body .corner-tl,
            body .corner-bl {
                left: -1px;
            }
            body .corner-tr,
            body .corner-br {
                right: -1px;
            }
            #slots-container.space-y-3 > * + * { margin-top: 0.75rem; }
            #slots-container .slot-card { padding: 0.93rem; }
            #slots-container .slot-card {
                border-width: 1px;
                box-shadow: 2px 2px 0px var(--blue-dark);
            }
            #slots-container {
                padding-right: 0.67rem;
            }
            #slots-container .slot-card .gap-4 { gap: 1rem; }
            #slots-container .slot-card .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
            #slots-container .slot-card .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
            #slots-container .slot-card .text-xs { font-size: 0.75rem; line-height: 1rem; }
            #slots-container .slot-card .h-12 { height: 3rem; }
            #slots-container .slot-card .w-12 { width: 3rem; }
            #slots-container .slot-card .h-10 { height: 2.5rem; }
            #slots-container .slot-card .w-10 { width: 2.5rem; }
            #slots-container .slot-card > .flex.items-center.gap-4:nth-child(2) {
                flex-shrink: 0;
            }
            body .stat-bar-container { height: 4.5px; }
            .grid.grid-cols-2.gap-x-10.gap-y-3.pb-2 {
                column-gap: 4.75rem;
                transform: translate(0.25rem, -0.4rem);
            }
            .grid.grid-cols-2.gap-x-10.gap-y-3.pb-2 > div {
                width: 20rem;
            }
            .mt-5.flex.gap-4.items-center {
                gap: 1rem;
                margin-top: 1.25rem;
                transform: translateY(-0.18rem);
            }
            .mt-5.flex.gap-4.items-center .btn-apply {
                min-width: 0;
                padding: 1.25rem 1rem;
                font-size: 1.15rem;
                line-height: 1.25rem;
                letter-spacing: 0.08em;
            }
        }

        .parallelogram {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
        .parallelogram-reverse {
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
        }

        /* 槽位卡片 - 硬阴影 */
        .slot-card {
            background: white;
            border: 2px solid var(--blue-main);
            box-shadow: 5px 5px 0px var(--blue-dark);
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
        }
        .slot-card:hover {
            box-shadow: 7px 7px 0px var(--blue-dark);
            transform: translate(-1px, -1px);
        }

        /* 属性条 - 梯形 */
        .stat-bar-container {
            clip-path: polygon(0 0, 100% 0, 96% 100%, 3% 100%);
            height: 12px;
            background: var(--blue-light);
            position: relative;
        }
        .stat-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--blue-main);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-bar-fill.down { background: var(--red); }

        /* 按钮 */
        .btn-apply {
            background: var(--blue-main);
            color: white;
            clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
            transition: all 0.2s;
        }
        .btn-apply:hover { background: var(--blue-dark); }

        .btn-reset {
            background: white;
            color: var(--blue-main);
            border: 2px solid var(--blue-main);
            transition: all 0.2s;
        }
        .btn-reset:hover { background: var(--blue-light); }

        .btn-exit {
            background: var(--red);
            color: white;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            transition: all 0.2s;
        }
        .btn-exit:hover { background: #b91c1c; }

        @media (max-width: 640px) {
            body .corner-br {
                width: 2.35rem;
                height: 2.35rem;
            }
            #slots-container .slot-card > .flex.items-center.gap-4:nth-child(2) > .w-10.h-10 {
                width: 2.25rem;
                height: 2.25rem;
                border-width: 1px;
                background: transparent;
                box-shadow: none;
                transform: translateX(-0.18rem);
            }
            #slots-container .slot-card > .flex.items-center.gap-4:nth-child(2) > .w-10.h-10 svg {
                width: 1rem;
                height: 1rem;
            }
            .mt-5.flex.gap-4.items-center .btn-reset,
            .mt-5.flex.gap-4.items-center .btn-exit {
                padding: 1.25rem 1.5rem;
                font-size: 1.15rem;
                line-height: 1.25rem;
                letter-spacing: 0.08em;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mt-5.flex.gap-4.items-center .btn-reset { border-width: 1px; }
            body .btn-reset,
            body .btn-exit {
                padding-top: 1.25rem;
                padding-bottom: 1.25rem;
                line-height: 1.25rem;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            body .btn-reset {
                border-width: 1px;
            }
        }

        /* 下拉菜单 */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid var(--blue-main);
            box-shadow: 5px 5px 0px var(--blue-dark);
            z-index: 100;
            display: none;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--blue-light);
            transition: background 0.15s;
        }
        .dropdown-item:hover { background: var(--blue-pale); }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item.selected { background: var(--blue-light); font-weight: 700; }

        /* 武器展示框 */
        .weapon-outer-frame {
            border: 2px solid var(--blue-main);
            position: relative;
        }
        .weapon-inner-frame {
            border: 1.5px solid var(--blue-main);
            position: relative;
        }

        .corner-tl {
            position: absolute;
            top: -2px; left: -2px;
            width: 20px; height: 20px;
            border-top: 3px solid var(--red);
            border-left: 3px solid var(--red);
        }
        .corner-tr {
            position: absolute;
            top: -2px; right: -2px;
            width: 20px; height: 20px;
            border-top: 3px solid var(--blue-main);
            border-right: 3px solid var(--blue-main);
        }
        .corner-bl {
            position: absolute;
            bottom: -2px; left: -2px;
            width: 20px; height: 20px;
            border-bottom: 3px solid var(--blue-main);
            border-left: 3px solid var(--blue-main);
        }
        .corner-br {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 20px; height: 20px;
            border-bottom: 3px solid var(--red);
            border-right: 3px solid var(--red);
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--blue-main); }

        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }

        @keyframes pulseRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-red { animation: pulseRed 2s infinite; }

        .fixed { position: fixed; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .top-20 { top: 5rem; }
        .top-4 { top: 1rem; }
        .top-1\/2 { top: 50%; }
        .right-8 { right: 2rem; }
        .right-6 { right: 1.5rem; }
        .bottom-6 { bottom: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .left-1\/2 { left: 50%; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }
        .inline-block { display: inline-block; }
        .flex { display: flex; }
        .grid { display: grid; }
        .items-center { align-items: center; }
        .items-baseline { align-items: baseline; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }
        .flex-shrink-0 { flex-shrink: 0; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }
        .gap-x-10 { column-gap: 2.5rem; }
        .gap-y-3 { row-gap: 0.75rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .object-contain { object-fit: contain; }
        .h-screen { height: 100vh; }
        .h-full { height: 100%; }
        .w-screen { width: 100vw; }
        .h-4 { height: 1rem; }
        .h-14 { height: 3.5rem; }
        .h-11 { height: 2.75rem; }
        .h-5 { height: 1.25rem; }
        .h-6 { height: 1.5rem; }
        .h-7 { height: 1.75rem; }
        .h-10 { height: 2.5rem; }
        .h-12 { height: 3rem; }
        .h-3\/5 { height: 60%; }
        .w-1\/2 { width: 50%; }
        .w-3\/5 { width: 60%; }
        .w-4 { width: 1rem; }
        .w-5 { width: 1.25rem; }
        .w-6 { width: 1.5rem; }
        .w-10 { width: 2.5rem; }
        .w-12 { width: 3rem; }
        .w-full { width: 100%; }
        .max-w-xl { max-width: 36rem; }
        .w-px { width: 1px; }

        .bg-white { background: #fff; }

        .border-1 { border-width: 1px; }

        .border-b-2 { border-bottom-width: 2px; }
        .border-solid { border-style: solid; }
        .border-blue-300 { border-color: var(--blue-soft); }

        .text-right { text-align: right; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }

<body class="h-screen w-screen flex flex-col">

<!-- 顶部 Header -->
<header class="h-14 flex items-center justify-between px-6 relative z-20">
    <div class="flex items-center gap-6">
        <div class="parallelogram bg-blue-700 h-11 flex items-center px-5 gap-3">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
            <div class="flex flex-col leading-none">
                <span class="text-white text-base font-bold tracking-widest">WEAPON MOD</span>
                <span class="text-white text-base font-bold tracking-widest">BAY</span>
            </div>
        </div>
        <div class="text-blue-900 font-semibold text-sm tracking-wider">SECTOR 7 // HANGAR 04</div>
    </div>

    <div class="flex items-center gap-8">
        <div class="flex items-center gap-2 pb-1 border-b-2 border-blue-600">
            <svg class="w-5 h-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
            </svg>
            <span class="font-bold text-blue-900 text-xl" id="credits-display">9,600</span>
            <span class="text-xs text-blue-600 font-bold">CR</span>
        </div>
        <div class="flex items-center gap-2 pb-1 border-b-2 border-blue-600">
            <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
            </svg>
            <span class="font-bold text-blue-900 text-xl">240</span>
            <span class="text-xs text-blue-600 font-bold">PTS</span>
        </div>
        <button class="text-blue-400 hover:text-blue-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
        </button>
    </div>
</header>

<!-- 主内容区 -->
<main class="flex-1 flex relative overflow-hidden px-6 pb-4">

    <!-- 左侧：武器展示区 -->
    <section class="w-1/2 flex flex-col relative z-10 pr-4">
        <!-- 武器展示框 -->
        <div class="flex-1 relative flex items-center justify-center py-4">
            <div class="weapon-outer-frame w-full max-w-xl aspect-[4/3] p-4">
                <div class="weapon-inner-frame w-full h-full bg-white/40 flex items-center justify-center relative">
                    <div class="corner-tl"></div>
                    <div class="corner-tr"></div>
                    <div class="corner-bl"></div>
                    <div class="corner-br"></div>

                    <!-- 武器图片 -->
                    <gunshow class="weapon-gunshow"
                             item="tacz:modern_kinetic_gun"
                             gun-id="tacz:m4a1"
                             display-id="tacz:m4a1_display"
                             skip-cache="true"
                             random-full-attachments="true"></gunshow>

                    <!-- CLASS 标签 -->
                    <div class="absolute top-4 right-6 text-right">
                        <div class="text-blue-400 text-xs tracking-widest font-bold">CLASS</div>
                        <div class="text-blue-900 text-xl font-bold tracking-wider">TACTICAL</div>
                    </div>

                    <!-- MODEL 标签 -->
                    <div class="absolute bottom-6 left-6 parallelogram bg-blue-700 px-4 py-1.5">
                        <div class="text-blue-200 text-[10px] tracking-widest font-bold leading-tight">MODEL</div>
                        <div class="text-white text-lg font-bold tracking-wider leading-tight">AERO-X7</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 属性面板 -->
        <div class="grid grid-cols-2 gap-x-10 gap-y-3 pb-2">
            <div>
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-sm font-bold text-blue-900 tracking-wider">DAMAGE</span>
                    <span class="text-sm font-bold text-blue-600" id="val-damage">42</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-damage" style="width: 42%"></div>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-sm font-bold text-blue-900 tracking-wider">FIRE RATE</span>
                    <span class="text-sm font-bold text-blue-600" id="val-firerate">65</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-firerate" style="width: 65%"></div>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-sm font-bold text-blue-900 tracking-wider">ACCURACY</span>
                    <span class="text-sm font-bold text-blue-600" id="val-accuracy">78</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-accuracy" style="width: 78%"></div>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-sm font-bold text-blue-900 tracking-wider">RECOIL</span>
                    <span class="text-sm font-bold text-red-600" id="val-recoil">35</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill down" id="bar-recoil" style="width: 35%"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 中间分割线 -->
    <div class="w-px bg-blue-200 relative z-10 my-8 flex-shrink-0">
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-5 h-5 bg-red-600 rotate-45"></div>
    </div>

    <!-- 右侧：配件选择区 -->
    <section class="w-1/2 flex flex-col pl-6 relative z-10">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-blue-900 tracking-widest flex items-center gap-3">
                <span class="w-1.5 h-7 bg-red-600 inline-block"></span>
                MODIFICATION SLOTS
            </h2>
            <div class="text-sm text-blue-500 font-bold tracking-wider">5 SLOTS AVAILABLE</div>
        </div>

        <div class="flex-1 overflow-y-auto pr-2 space-y-3" id="slots-container">
            <!-- 槽位将通过 JS 生成 -->
        </div>

        <!-- 底部操作按钮 -->
        <div class="mt-5 flex gap-4 items-center">
            <button class="btn-apply flex-1 py-4 text-xl font-bold tracking-widest flex items-center justify-center gap-2" onclick="applyMods()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <span>APPLY MODS</span>
            </button>
            <button class="btn-reset px-8 py-4 text-xl font-bold tracking-widest" onclick="resetMods()">
                <span>RESET</span>
            </button>
            <button class="btn-exit px-8 py-4 text-xl font-bold tracking-widest" onclick="goBack()">
                <span>EXIT</span>
            </button>
        </div>
    </section>
</main>

<!-- Toast -->
<div id="toast" class="fixed top-20 right-8 bg-blue-900 text-white px-6 py-3 parallelogram shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3">
    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <span id="toast-msg" class="font-bold tracking-wider">MODIFICATIONS APPLIED</span>
</div>

<script>
    var slotsData = [
        {
            id: 'optic',
            name: 'OPTIC / SIGHT',
            icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />',
            options: [
                { name: 'IRON SIGHTS', cost: 0, stats: { accuracy: 0, firerate: 0 } },
                { name: 'HOLO SIGHT MK-II', cost: 500, stats: { accuracy: 15, firerate: 0 } },
                { name: 'AVIATION SCOPE 4X', cost: 1200, stats: { accuracy: 25, firerate: -5 } }
            ],
            current: 0
        },
        {
            id: 'barrel',
            name: 'BARREL / MUZZLE',
            icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />',
            options: [
                { name: 'STANDARD BARREL', cost: 0, stats: { damage: 0, recoil: 0 } },
                { name: 'COMPENSATOR PRO', cost: 800, stats: { damage: -5, recoil: -20 } },
                { name: 'LONG RANGE TUNED', cost: 1500, stats: { damage: 15, recoil: 10 } }
            ],
            current: 0
        },
        {
            id: 'magazine',
            name: 'MAGAZINE',
            icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />',
            options: [
                { name: 'STD 30-ROUND', cost: 0, stats: { firerate: 0, recoil: 0 } },
                { name: 'EXTENDED 45-ROUND', cost: 600, stats: { firerate: -5, recoil: 10 } },
                { name: 'DRUM MAG 60-ROUND', cost: 1200, stats: { firerate: -10, recoil: 20 } }
            ],
            current: 0
        },
        {
            id: 'grip',
            name: 'UNDERBARREL / GRIP',
            icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />',
            options: [
                { name: 'STANDARD GRIP', cost: 0, stats: { recoil: 0, accuracy: 0 } },
                { name: 'VERTICAL GRIP', cost: 400, stats: { recoil: -15, accuracy: 5 } },
                { name: 'ANGLED GRIP', cost: 700, stats: { recoil: -5, accuracy: 15 } }
            ],
            current: 0
        },
        {
            id: 'skin',
            name: 'CAMOUFLAGE / SKIN',
            icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />',
            options: [
                { name: 'FACTORY WHITE', cost: 0, stats: {} },
                { name: 'SKY FORCE BLUE', cost: 2000, stats: {} },
                { name: 'CRIMSON EAGLE', cost: 3500, stats: {} }
            ],
            current: 0
        }
    ];

    var baseStats = { damage: 42, firerate: 65, accuracy: 78, recoil: 35 };
    var currentStats = copyStats(baseStats);
    var openDropdown = null;

    function copyStats(source) {
        var result = {};
        for (var key in source) {
            if (Object.prototype.hasOwnProperty.call(source, key)) {
                result[key] = source[key];
            }
        }
        return result;
    }

    function renderSlots() {
        var container = document.getElementById('slots-container');
        container.innerHTML = '';

        for (var index = 0; index < slotsData.length; index++) {
            var slot = slotsData[index];
            var currentOption = slot.options[slot.current];
            var isDefault = slot.current === 0;

            var slotEl = document.createElement('div');
            slotEl.className = 'slot-card p-4 flex items-center justify-between slide-in';
            slotEl.style.animationDelay = (index * 0.06) + 's';
            slotEl.style.opacity = '0';

            var detailsHtml = isDefault
                ? '<div class="text-sm text-blue-400 font-bold tracking-wider">DEFAULT</div>'
                : '<div class="text-right">'
                + '<div class="text-xs text-blue-400 font-bold">COST</div>'
                + '<div class="font-bold text-red-600 text-lg">' + currentOption.cost + ' CR</div>'
                + '</div>';

            var optionsHtml = '';
            for (var i = 0; i < slot.options.length; i++) {
                var opt = slot.options[i];
                var selectedClass = i === slot.current ? ' selected' : '';
                var costHtml = opt.cost > 0
                    ? '<span class="text-sm text-red-600 font-bold">' + opt.cost + ' CR</span>'
                    : '<span class="text-xs text-blue-400 font-bold">DEFAULT</span>';
                optionsHtml += '<div class="dropdown-item' + selectedClass + '" onclick="event.stopPropagation(); selectOption(' + index + ', ' + i + ')">'
                    + '<div class="flex justify-between items-center">'
                    + '<span class="font-bold text-blue-900">' + opt.name + '</span>'
                    + costHtml
                    + '</div>'
                    + '</div>';
            }

            slotEl.innerHTML = ''
                + '<div class="flex items-center gap-4">'
                + '    <div class="w-12 h-12 bg-blue-100 border-2 border-blue-300 flex items-center justify-center flex-shrink-0">'
                + '        <svg class="w-6 h-6 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">'
                +              slot.icon
                + '        </svg>'
                + '    </div>'
                + '    <div>'
                + '        <div class="text-xs text-blue-500 font-bold tracking-widest mb-0.5">' + slot.name + '</div>'
                + '        <div class="text-xl font-bold text-blue-900 tracking-wide">' + currentOption.name + '</div>'
                + '    </div>'
                + '</div>'
                + '<div class="flex items-center gap-4">'
                +      detailsHtml
                + '    <div class="w-10 h-10 border-2 border-blue-300 flex items-center justify-center flex-shrink-0 hover:border-blue-600 hover:bg-blue-50 transition-all cursor-pointer" onclick="event.stopPropagation(); toggleDropdown(' + index + ')">'
                + '        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">'
                + '            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'
                + '        </svg>'
                + '    </div>'
                + '</div>'
                + '<div class="dropdown-menu" id="dropdown-' + index + '">'
                +      optionsHtml
                + '</div>';
            container.appendChild(slotEl);
        }

        updateStats();
    }

    function toggleDropdown(index) {
        var dropdown = document.getElementById('dropdown-' + index);
        if (openDropdown !== null && openDropdown !== index) {
            document.getElementById('dropdown-' + openDropdown).classList.remove('show');
        }
        dropdown.classList.toggle('show');
        openDropdown = dropdown.classList.contains('show') ? index : null;
    }

    function selectOption(slotIndex, optionIndex) {
        slotsData[slotIndex].current = optionIndex;
        document.getElementById('dropdown-' + slotIndex).classList.remove('show');
        openDropdown = null;
        renderSlots();
    }

    function updateStats() {
        var stats = copyStats(baseStats);
        for (var i = 0; i < slotsData.length; i++) {
            var slot = slotsData[i];
            var option = slot.options[slot.current];
            if (option.stats) {
                for (var key in option.stats) {
                    stats[key] = (stats[key] || 0) + option.stats[key];
                }
            }
        }

        for (var key in stats) {
            stats[key] = Math.max(0, Math.min(100, stats[key]));
        }
        currentStats = stats;

        var keys = ['damage', 'firerate', 'accuracy', 'recoil'];
        for (var i = 0; i < keys.length; i++) {
            var statKey = keys[i];
            var valEl = document.getElementById('val-' + statKey);
            var barEl = document.getElementById('bar-' + statKey);

            valEl.innerText = stats[statKey];
            barEl.style.width = stats[statKey] + '%';

            barEl.className = 'stat-bar-fill';
            if (statKey === 'recoil') {
                if (stats[statKey] < baseStats[statKey]) barEl.classList.add('up');
                else if (stats[statKey] > baseStats[statKey]) barEl.classList.add('down');
            } else {
                if (stats[statKey] > baseStats[statKey]) barEl.classList.add('up');
                else if (stats[statKey] < baseStats[statKey]) barEl.classList.add('down');
            }
        }
    }

    function applyMods() {
        var totalCost = 0;
        for (var i = 0; i < slotsData.length; i++) {
            totalCost += slotsData[i].options[slotsData[i].current].cost;
        }

        var creditsEl = document.getElementById('credits-display');
        var currentCredits = parseInt(creditsEl.innerText.replace(/,/g, ''), 10);

        if (currentCredits < totalCost) {
            showToast('INSUFFICIENT CREDITS!', true);
            return;
        }

        currentCredits -= totalCost;
        creditsEl.innerText = currentCredits.toLocaleString();
        showToast('MODIFICATIONS APPLIED SUCCESSFULLY');
    }

    function resetMods() {
        for (var i = 0; i < slotsData.length; i++) {
            slotsData[i].current = 0;
        }
        renderSlots();
        showToast('MODIFICATIONS RESET');
    }

    function goBack() {
        showToast('RETURNING TO HANGAR...');
    }

    function showToast(msg, isError) {
        if (typeof isError === 'undefined') {
            isError = false;
        }
        var toast = document.getElementById('toast');
        var toastMsg = document.getElementById('toast-msg');

        toastMsg.innerText = msg;
        toast.className = toast.className.replace(/bg-\S+/, isError ? 'bg-red-600' : 'bg-blue-900');
        toast.classList.remove('translate-x-full');
        setTimeout(function () { toast.classList.add('translate-x-full'); }, 2500);
    }

    document.addEventListener('click', function (e) {
        if (openDropdown !== null && !e.target.closest('.slot-card')) {
            document.getElementById('dropdown-' + openDropdown).classList.remove('show');
            openDropdown = null;
        }
    });

    renderSlots();
</script>
</body>
</html>
